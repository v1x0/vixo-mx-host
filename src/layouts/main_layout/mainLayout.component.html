<div class="layout">
  <mat-toolbar class="layout__toolbar" role="banner">
    <a class="layout__brand" routerLink="/home">
      <mat-icon class="layout__logo" aria-hidden="true">hub</mat-icon>
      <span class="layout__title">{{ appName }}</span>
    </a>

    @if (user(); as currentUser) {
      <nav class="layout__nav" aria-label="Aplicaciones">
        <a mat-button routerLink="/home" routerLinkActive="layout__link--active" ariaCurrentWhenActive="page">
          Inicio
        </a>
        @for (item of menu(); track item.path) {
          <a mat-button [routerLink]="item.path" routerLinkActive="layout__link--active" ariaCurrentWhenActive="page">
            <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
            {{ item.title }}
          </a>
        }
      </nav>

      <span class="layout__spacer"></span>
      <span class="layout__user">{{ currentUser.username }} · {{ currentUser.roles.join(', ') }}</span>
      <button mat-button type="button" class="layout__logout" aria-label="Cerrar sesión" (click)="logout()">
        <mat-icon aria-hidden="true">logout</mat-icon>
        <span class="layout__logout-label">Cerrar sesión</span>
      </button>
    }
  </mat-toolbar>

  <main class="layout__content">
    <router-outlet />
  </main>
</div>
